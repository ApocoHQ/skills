name: Sync bundled skills for code-quality-guide

on:
  push:
    branches: [main]
    paths:
      - 'skills/align-repo/**'
      - 'skills/design-first-engineering/**'
      - 'skills/grill-me/**'
      - 'skills/write-a-prd/**'

jobs:
  sync-bundled-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Sync and commit bundled skills
        run: |
          BUNDLED="skills/code-quality-guide/bundled-skills"
          for skill in align-repo design-first-engineering grill-me write-a-prd; do
            rm -rf "$BUNDLED/$skill"
            cp -r "skills/$skill" "$BUNDLED/$skill"
          done
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add "$BUNDLED"
          git commit -m "chore: sync bundled skills for code-quality-guide"
          git push
